[package]
name = "modpack-builder"
version = "0.1.0"
edition = "2024"
description = "Portable Factorio 2.1 modpack builder"
license = "MIT"
repository = ""

[lib]
name = "modpack_builder"
path = "src/lib.rs"

[[bin]]
name = "ModpackBuilder"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
inquire = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.3"
tempfile = "3.27.0"
zip = "9.6.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
